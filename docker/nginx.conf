server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: parameters live in the URL hash, so no server-side
    # routing is required -- but a hard reload must still resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames -- safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}